    <!--
      Paints the shell as the previous page left it, before the modules load: title, active entry and, from the
      tab's cache (Shell module), the user and the entries they may see. The module then checks with the server.
    -->
    <script>
      (function () {
        var body = document.body;
        var title = document.querySelector('[data-page-title]');
        if (title) title.textContent = body.getAttribute('data-title') || '';
        var items = document.querySelectorAll('[data-nav-item]');
        for (var i = 0; i < items.length; i++) {
          if (items[i].getAttribute('data-nav-item') === body.getAttribute('data-nav')) {
            items[i].classList.add('active');
            items[i].setAttribute('aria-current', 'page');
          }
        }
        try {
          var shell = JSON.parse(sessionStorage.getItem('md-shell') || 'null');
          if (!shell || !shell.capabilities) return;
          var guarded = document.querySelectorAll('[data-requires]');
          for (var j = 0; j < guarded.length; j++) {
            var needed = (guarded[j].getAttribute('data-requires') || '').split(' ');
            var allowed = false;
            for (var k = 0; k < needed.length; k++) allowed = allowed || shell.capabilities[needed[k]] === true;
            guarded[j].hidden = !allowed;
          }
          var names = document.querySelectorAll('[data-user-name]');
          for (var n = 0; n < names.length; n++) names[n].textContent = shell.displayName || '';
          var logins = document.querySelectorAll('[data-user-login]');
          for (var l = 0; l < logins.length; l++) logins[l].textContent = shell.login ? '@' + shell.login : '';
          var avatar = document.querySelector('[data-user-avatar]');
          var fallback = document.querySelector('[data-user-avatar-fallback]');
          if (avatar && fallback && typeof shell.avatarUrl === 'string' && shell.avatarUrl.indexOf('https://') === 0) {
            avatar.src = shell.avatarUrl;
            avatar.hidden = false;
            fallback.hidden = true;
          }
        } catch (e) {
          /* storage blocked or malformed: the Shell module fills everything in */
        }
      })();
    </script>
