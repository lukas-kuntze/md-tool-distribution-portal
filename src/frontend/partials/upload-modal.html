<div class="modal-overlay" id="upload-modal" hidden>
  <form class="modal" id="upload-form" role="dialog" aria-modal="true" aria-labelledby="upload-modal-title" novalidate>
    <div class="modal-header">
      <h3 id="upload-modal-title" data-upload-title>Build hochladen</h3>
      <button type="button" class="close-btn" data-modal-close aria-label="Schließen">&times;</button>
    </div>
    <div class="modal-body">
      <p class="text-muted" data-upload-intro></p>
      <div class="form-group" data-upload-kind hidden>
        <label class="form-label" for="upload-kind">Art der Datei</label>
        <select id="upload-kind" name="kind" class="form-control">
          <option value="binary">APK, AAB oder IPA (wird aus der Datei erkannt)</option>
          <option value="dsym">dSYM (ZIP)</option>
          <option value="mapping">Mapping-Datei (TXT)</option>
          <option value="metadata">Build-Metadaten (JSON)</option>
        </select>
      </div>
      <div class="form-group">
        <span class="form-label" id="upload-file-label">Datei</span>
        <label class="file-drop" data-file-drop>
          <input
            type="file"
            name="file"
            class="file-drop-input"
            accept=".apk,.aab,.ipa"
            aria-labelledby="upload-file-label"
            data-autofocus
          />
          <span class="material-icons-outlined file-drop-icon" aria-hidden="true">upload_file</span>
          <span class="file-drop-text" data-file-name>Datei hierher ziehen oder <u>auswählen</u></span>
          <span class="form-helper" data-file-hint></span>
        </label>
      </div>
      <div class="form-group" data-upload-commit hidden>
        <label class="form-label" for="upload-commit">Commit-SHA</label>
        <input
          id="upload-commit"
          name="commitSha"
          class="form-control form-control-mono"
          type="text"
          maxlength="64"
          spellcheck="false"
          autocomplete="off"
          placeholder="z. B. aus git rev-parse HEAD"
        />
        <div class="form-helper">
          Pflicht, wenn der Build ein neues Release startet. Für die zweite Plattform eines bestehenden Releases leer
          lassen.
        </div>
      </div>
      <div class="upload-progress" data-upload-progress hidden>
        <progress max="100" value="0" aria-labelledby="upload-progress-label"></progress>
        <span id="upload-progress-label" data-upload-percent>0 %</span>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" data-modal-close>Abbrechen</button>
      <button type="submit" class="btn btn-primary">Hochladen</button>
    </div>
  </form>
</div>
