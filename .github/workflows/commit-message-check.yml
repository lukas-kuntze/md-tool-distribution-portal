name: Validate Commit Messages

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate-commits:
    name: Validate Conventional Commit Messages
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Commit Messages Against Conventional Commit Standard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          conventional_commit_regex="$(cat .githooks/conventional-commit.pattern)"

          commits=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | [.sha, (.commit.message | split("\n")[0])] | @tsv')

          if [[ -z "$commits" ]]; then
            echo "No commits found in pull request; nothing to validate."
            exit 0
          fi

          invalid=0
          while IFS=$'\t' read -r sha subject; do
            short_sha="${sha:0:7}"

            if [[ "$subject" =~ $conventional_commit_regex ]]; then
              printf "\e[32m+ %s  %s\e[0m\n" "$short_sha" "$subject"
            else
              printf "\e[31mx %s  %s\e[0m\n" "$short_sha" "$subject"
              invalid=1
            fi
          done <<< "$commits"

          if [[ "$invalid" -eq 0 ]]; then
            printf "\n\e[32mAll commit messages meet Conventional Commit standards.\e[0m\n"
            exit 0
          fi

          printf "\n\e[31mOne or more commit messages do not meet the Conventional Commit standard.\e[0m\n"
          echo "Example of a valid message:"
          echo "  feat(login): ABC-123 add the 'remember me' button"
          echo "More details: https://www.conventionalcommits.org/en/v1.0.0/#summary"
          exit 1
